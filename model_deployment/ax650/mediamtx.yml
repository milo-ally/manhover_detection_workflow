# MediaMTX 配置（与主项目 /home/milo/桌面/00_lyg_ai_platform 一致）
# 主项目 mediamtx.exe 内含 MediaMTX v1.20.0。
logLevel: debug
logDestinations: [stdout]
logFile: mediamtx.log
readTimeout: 120s
writeTimeout: 30s
writeQueueSize: 16384
udpMaxPayloadSize: 1472
udpReadBufferSize: 2097152

authMethod: internal
authInternalUsers:
- user: any
  pass:
  ips: []
  permissions:
  - action: publish
    path:
  - action: read
    path:
  - action: playback
    path:

api: yes
apiAddress: :9997

rtsp: yes
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: :8554
rtpAddress: :9000
rtcpAddress: :9001

paths:
  live1:
    source: udp+rtp://0.0.0.0:8000
    sourceOnDemand: no
    sourceOnDemandStartTimeout: 10s
    useAbsoluteTimestamp: true
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=LYGNeuroLink Stream 1
      c=IN IP4 0.0.0.0
      t=0 0
      m=video 8000 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1;profile-level-id=4D4034

